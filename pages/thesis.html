<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thesis — stock-porn</title>
  <meta name="description" content="Automated weekly sector rotation theses. No human hands. Timestamped predictions, named picks, public resolution." />
  <link rel="canonical" href="https://stock-porn.loyal9.app/pages/thesis.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://stock-porn.loyal9.app/pages/thesis.html" />
  <meta property="og:title" content="Thesis — stock-porn" />
  <meta property="og:description" content="Automated weekly sector rotation theses. No human hands. Timestamped predictions, named picks, public resolution." />
  <meta property="og:image" content="https://stock-porn.loyal9.app/assets/img/og-preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:title" content="Thesis — stock-porn" />
  <meta name="twitter:description" content="Automated weekly sector rotation theses. No human hands. Timestamped predictions, named picks, public resolution." />
  <meta name="twitter:image" content="https://stock-porn.loyal9.app/assets/img/og-preview.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0d0d0d; --surface: #141414; --surface2: #1a1a1a;
      --border: #2a2a2a; --text: #e8e8e8; --muted: #666;
      --green: #00c853; --red: #ff1744; --amber: #ffab00;
      --green-dim: #00c85322; --red-dim: #ff174422; --amber-dim: #ffab0022;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.6; }
    .page { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* SUMMARY BAR */
    .summary-bar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem; margin-bottom: 1.5rem;
    }
    .summary-cell { background: var(--surface); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: 4px; }
    .s-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.2rem; }
    .s-value { font-size: 1.1rem; font-weight: bold; }
    .pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--muted); } .amber { color: var(--amber); }

    /* FILTERS */
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; align-items: center; }
    .filter-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      font-family: 'Courier New', monospace; font-size: 0.72rem;
      padding: 0.3rem 0.75rem; border-radius: 3px; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.15s;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--green); color: var(--green); }
    .filter-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }

    /* THESIS CARDS */
    .thesis-list { display: flex; flex-direction: column; gap: 1rem; }

    .thesis-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .thesis-card.open    { border-left: 3px solid var(--amber); }
    .thesis-card.confirmed { border-left: 3px solid var(--green); }
    .thesis-card.partial   { border-left: 3px solid var(--amber); }
    .thesis-card.refuted   { border-left: 3px solid var(--red); }

    .card-header {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.75rem 1rem; cursor: pointer;
      border-bottom: 1px solid transparent; transition: background 0.1s;
    }
    .card-header:hover { background: var(--surface2); }
    .card-header.expanded { border-bottom-color: var(--border); }

    .thesis-id   { font-size: 0.7rem; color: var(--muted); min-width: 2rem; }
    .thesis-meta { flex: 1; }
    .thesis-sector { font-weight: bold; font-size: 0.95rem; }
    .thesis-dates  { font-size: 0.68rem; color: var(--muted); margin-top: 0.1rem; }

    .status-badge {
      font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 2px;
      font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .badge-open      { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
    .badge-confirmed { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .badge-partial   { background: var(--amber-dim); color: var(--amber); border: 1px solid var(--amber); }
    .badge-refuted   { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }

    .direction-badge {
      font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 2px;
      font-weight: bold; text-transform: uppercase;
    }
    .dir-bullish { background: var(--green-dim); color: var(--green); border: 1px solid var(--green); }
    .dir-bearish { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red); }

    /* CARD BODY */
    .card-body { padding: 1rem; display: none; }
    .card-body.visible { display: block; }

    .thesis-text {
      font-size: 0.8rem; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); padding: 0.6rem 0.8rem;
      border-radius: 3px; margin-bottom: 1rem; line-height: 1.7;
    }

    .evidence-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.6rem; margin-bottom: 1rem;
    }
    .e-cell { background: var(--bg); border: 1px solid var(--border); padding: 0.5rem 0.75rem; border-radius: 3px; }
    .e-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.2rem; }
    .e-value { font-size: 0.85rem; font-weight: bold; }

    /* PICKS TABLE */
    .picks-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.5rem; }
    .picks-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-bottom: 1rem; }
    .picks-table th {
      text-align: left; padding: 0.3rem 0.6rem;
      font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--muted); font-weight: normal; border-bottom: 1px solid var(--border);
    }
    .picks-table th.right, .picks-table td.right { text-align: right; }
    .picks-table td { padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
    .picks-table tr:last-child td { border-bottom: none; }
    .pick-ticker { color: var(--green); font-weight: bold; }

    /* RESOLUTION */
    .resolution-box {
      background: var(--bg); border: 1px solid var(--border);
      padding: 0.6rem 0.8rem; border-radius: 3px; font-size: 0.78rem;
    }
    .resolution-box.confirmed { border-color: var(--green); }
    .resolution-box.partial   { border-color: var(--amber); }
    .resolution-box.refuted   { border-color: var(--red); }

    /* LINKED */
    .linked-row { font-size: 0.7rem; color: var(--muted); margin-top: 0.75rem; }
    .linked-row a { color: var(--amber); text-decoration: none; cursor: pointer; }
    .linked-row a:hover { text-decoration: underline; }

    .empty { color: var(--muted); font-size: 0.8rem; padding: 2rem; text-align: center; }

    footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); text-align: center; }
    footer a { color: var(--green); text-decoration: none; }

    @media (max-width: 600px) {
      .card-header { flex-wrap: wrap; }
      .evidence-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div id="nav-root"></div>
  <script src="../components/nav.js"></script>

  <div class="page">

    <div class="summary-bar" id="summaryBar">
      <div class="summary-cell">
        <div class="s-label">Total Theses</div>
        <div class="s-value muted" id="sumTotal">—</div>
      </div>
      <div class="summary-cell">
        <div class="s-label">Open</div>
        <div class="s-value amber" id="sumOpen">—</div>
      </div>
      <div class="summary-cell">
        <div class="s-label">Confirmed</div>
        <div class="s-value pos" id="sumConfirmed">—</div>
      </div>
      <div class="summary-cell">
        <div class="s-label">Partial</div>
        <div class="s-value amber" id="sumPartial">—</div>
      </div>
      <div class="summary-cell">
        <div class="s-label">Refuted</div>
        <div class="s-value neg" id="sumRefuted">—</div>
      </div>
      <div class="summary-cell">
        <div class="s-label">Accuracy</div>
        <div class="s-value muted" id="sumAccuracy">—</div>
      </div>
    </div>

    <div class="filters">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('open', this)">Open</button>
      <button class="filter-btn" onclick="setFilter('confirmed', this)">Confirmed</button>
      <button class="filter-btn" onclick="setFilter('partial', this)">Partial</button>
      <button class="filter-btn" onclick="setFilter('refuted', this)">Refuted</button>
      <button class="filter-btn" onclick="setFilter('bullish', this)">Bullish</button>
      <button class="filter-btn" onclick="setFilter('bearish', this)">Bearish</button>
    </div>

    <div class="thesis-list" id="thesisList">
      <div class="empty">loading...</div>
    </div>

  </div>

  <footer>
    Theses are fully automated — no human input · Not financial advice<br>
    <a href="legal.html">Legal</a> &nbsp;·&nbsp;
    <a href="https://buymeacoffee.com/goddardshannon9" target="_blank" rel="noopener">🍺 Buy the dev a beer</a>
  </footer>

  <script>
    let allTheses = [];
    let currentFilter = 'all';
    let expandedId = null;

    function fmt(v, prefix='$') {
      if (v === null || v === undefined) return '—';
      return (v >= 0 ? '+' : '') + prefix + Math.abs(v).toFixed(2);
    }

    function fmtPct(v) {
      if (v === null || v === undefined) return '—';
      return (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
    }

    function pnlClass(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'muted'; }

    function badgeHtml(status) {
      const map = {
        open: 'badge-open', confirmed: 'badge-confirmed',
        partial: 'badge-partial', refuted: 'badge-refuted',
      };
      return `<span class="status-badge ${map[status] || ''}">${status}</span>`;
    }

    function dirBadge(dir) {
      return `<span class="direction-badge ${dir === 'bullish' ? 'dir-bullish' : 'dir-bearish'}">${dir}</span>`;
    }

    function daysLeft(resolveBy) {
      const diff = Math.ceil((new Date(resolveBy) - new Date()) / 86400000);
      if (diff < 0) return '<span class="neg">overdue</span>';
      if (diff === 0) return '<span class="amber">resolves today</span>';
      return `<span class="muted">${diff}d left</span>`;
    }

    function renderCard(t) {
      const isExpanded = expandedId === t.id;
      const ev = t.evidence || {};
      const res = t.resolution;

      // picks table
      let picksHtml = '<div class="picks-title">Top Picks</div>';
      picksHtml += `
        <table class="picks-table">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Direction</th>
              <th class="right">Price @ Prediction</th>
              <th class="right">Price @ Resolution</th>
              <th class="right">Change</th>
            </tr>
          </thead>
          <tbody>
      `;
      (t.picks || []).forEach(p => {
        const chg = p.pct_change;
        const correct = chg !== null && (
          (t.direction === 'bullish' && chg > 0) ||
          (t.direction === 'bearish' && chg < 0)
        );
        picksHtml += `
          <tr>
            <td class="pick-ticker">${p.ticker}</td>
            <td>${dirBadge(p.direction)}</td>
            <td class="right muted">$${p.price_at_prediction ?? '—'}</td>
            <td class="right muted">${p.price_at_resolution !== null ? '$' + p.price_at_resolution : '—'}</td>
            <td class="right ${chg !== null ? (correct ? 'pos' : 'neg') : 'muted'}">${fmtPct(chg)}</td>
          </tr>
        `;
      });
      picksHtml += '</tbody></table>';

      // evidence grid
      const evHtml = `
        <div class="evidence-grid">
          <div class="e-cell">
            <div class="e-label">Signal ETF</div>
            <div class="e-value">${t.signal_etf || '—'}</div>
          </div>
          <div class="e-cell">
            <div class="e-label">ETF 1-Week</div>
            <div class="e-value ${pnlClass(ev.etf_week_return)}">${fmtPct(ev.etf_week_return)}</div>
          </div>
          <div class="e-cell">
            <div class="e-label">ETF 2-Week</div>
            <div class="e-value ${pnlClass(ev.etf_two_week_return)}">${fmtPct(ev.etf_two_week_return)}</div>
          </div>
          <div class="e-cell">
            <div class="e-label">SPY 1-Week</div>
            <div class="e-value ${pnlClass(ev.spy_week_return)}">${fmtPct(ev.spy_week_return)}</div>
          </div>
          <div class="e-cell">
            <div class="e-label">Options Flow</div>
            <div class="e-value ${ev.options_flow_ratio > 1.5 ? 'amber' : 'muted'}">${ev.options_flow_ratio ? ev.options_flow_ratio + 'x avg' : '—'}</div>
          </div>
          <div class="e-cell">
            <div class="e-label">Top Keywords</div>
            <div class="e-value muted" style="font-size:0.72rem">${(ev.top_keywords || []).slice(0,5).join(', ') || '—'}</div>
          </div>
        </div>
      `;

      // resolution
      let resHtml = '';
      if (res) {
        resHtml = `
          <div class="resolution-box ${res.outcome}">
            <strong>${res.outcome.toUpperCase()}</strong> — ${res.notes}
            Resolved ${res.date}.
            ${res.rolled_into ? `Rolled into <a onclick="jumpTo(${res.rolled_into})" style="color:var(--amber);cursor:pointer">Thesis #${res.rolled_into}</a>.` : ''}
          </div>
        `;
      }

      // linked theses
      let linkedHtml = '';
      if (t.linked_thesis_ids && t.linked_thesis_ids.length) {
        linkedHtml = `<div class="linked-row">Linked: ${t.linked_thesis_ids.map(id => `<a onclick="jumpTo(${id})">Thesis #${id}</a>`).join(', ')}</div>`;
      }

      return `
        <div class="thesis-card ${t.status}" id="thesis-card-${t.id}">
          <div class="card-header ${isExpanded ? 'expanded' : ''}" onclick="toggleCard(${t.id})">
            <span class="thesis-id">#${t.id}</span>
            <div class="thesis-meta">
              <div class="thesis-sector">${t.sector} <span style="font-weight:normal;color:var(--muted);font-size:0.8rem">— ${t.signal_etf}</span></div>
              <div class="thesis-dates">
                Written ${t.written_date} &nbsp;·&nbsp; Resolve by ${t.resolve_by}
                ${t.status === 'open' ? '&nbsp;·&nbsp;' + daysLeft(t.resolve_by) : ''}
              </div>
            </div>
            ${dirBadge(t.direction)}
            ${badgeHtml(t.status)}
          </div>
          <div class="card-body ${isExpanded ? 'visible' : ''}">
            <div class="thesis-text">${t.thesis}</div>
            ${evHtml}
            ${picksHtml}
            ${resHtml}
            ${linkedHtml}
          </div>
        </div>
      `;
    }

    function render() {
      const filtered = allTheses.filter(t => {
        if (currentFilter === 'open')      return t.status === 'open';
        if (currentFilter === 'confirmed') return t.status === 'confirmed';
        if (currentFilter === 'partial')   return t.status === 'partial';
        if (currentFilter === 'refuted')   return t.status === 'refuted';
        if (currentFilter === 'bullish')   return t.direction === 'bullish';
        if (currentFilter === 'bearish')   return t.direction === 'bearish';
        return true;
      });

      const list = document.getElementById('thesisList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">No theses match filter</div>';
        return;
      }

      // open first, then closed newest-first
      const sorted = [...filtered].sort((a, b) => {
        if (a.status === 'open' && b.status !== 'open') return -1;
        if (b.status === 'open' && a.status !== 'open') return 1;
        return b.id - a.id;
      });

      list.innerHTML = sorted.map(renderCard).join('');
    }

    function toggleCard(id) {
      expandedId = expandedId === id ? null : id;
      render();
    }

    function jumpTo(id) {
      expandedId = id;
      currentFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelector('.filter-btn').classList.add('active');
      render();
      setTimeout(() => {
        const el = document.getElementById('thesis-card-' + id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    async function loadData() {
      try {
        const res = await fetch('../data/thesis.json?t=' + Date.now());
        const data = await res.json();
        allTheses = (data.theses || []).slice().reverse();

        const total     = allTheses.length;
        const open      = allTheses.filter(t => t.status === 'open').length;
        const confirmed = allTheses.filter(t => t.status === 'confirmed').length;
        const partial   = allTheses.filter(t => t.status === 'partial').length;
        const refuted   = allTheses.filter(t => t.status === 'refuted').length;
        const closed    = confirmed + partial + refuted;
        const accuracy  = closed ? Math.round((confirmed + partial * 0.5) / closed * 100) : null;

        document.getElementById('sumTotal').textContent     = total;
        document.getElementById('sumOpen').textContent      = open;
        document.getElementById('sumConfirmed').textContent = confirmed;
        document.getElementById('sumPartial').textContent   = partial;
        document.getElementById('sumRefuted').textContent   = refuted;
        document.getElementById('sumAccuracy').textContent  = accuracy !== null ? accuracy + '%' : '—';
        document.getElementById('sumAccuracy').className    = 's-value ' + (accuracy >= 60 ? 'pos' : accuracy < 40 ? 'neg' : 'amber');

        if (!total) {
          document.getElementById('thesisList').innerHTML =
            '<div class="empty">First thesis generates Sunday night. Check back then.</div>';
          return;
        }

        render();
      } catch(e) {
        console.error(e);
        document.getElementById('thesisList').innerHTML =
          '<div class="empty">Error loading thesis data</div>';
      }
    }

    loadData();
  </script>

</body>
</html>
