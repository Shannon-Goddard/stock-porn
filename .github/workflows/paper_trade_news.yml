name: Paper Trade News Scan

on:
  schedule:
    # 6:25 AM PST = 14:25 UTC (standard time) / 13:25 UTC (daylight time)
    - cron: '25 14 * * 1-5'
    - cron: '25 13 * * 1-5'
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance scipy

      - name: Run news scan and candle fetch
        run: python scripts/fetch_news.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/trades.json data/candles/
          git diff --staged --quiet || git commit -m "news scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
