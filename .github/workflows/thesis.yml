name: Generate Thesis

on:
  schedule:
    # Sunday 8:00 PM PST = Monday 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  thesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance scipy

      - name: Run thesis generator
        run: python scripts/generate_thesis.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/thesis.json
          git diff --staged --quiet || git commit -m "weekly thesis $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
