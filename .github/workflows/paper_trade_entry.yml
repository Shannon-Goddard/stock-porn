name: Paper Trade Entry

on:
  schedule:
    # 3:55 PM PST = 23:55 UTC (standard time) / 22:55 UTC (daylight time)
    # Running both to cover DST transitions
    - cron: '55 23 * * 1-5'
    - cron: '55 22 * * 1-5'
  workflow_dispatch:

jobs:
  entry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance scipy

      - name: Run paper trade entry
        run: python scripts/paper_trade.py

      - name: Commit and push if data changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/trades.json data/blog.json
          git diff --staged --quiet || git commit -m "paper trade entry $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
