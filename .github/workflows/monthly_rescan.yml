name: Monthly Options Rescan

on:
  schedule:
    # 9:00 AM Eastern on the 1st of every month (14:00 UTC)
    - cron: '0 14 1 * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  rescan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run options scanner
        run: python scripts/scan_options.py

      - name: Commit and push updated data
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/stocks_optionable.csv data/metadata.json
          git diff --staged --quiet || git commit -m "monthly rescan $(date -u '+%Y-%m-%d')"
          git push
